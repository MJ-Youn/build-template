services:
  app:
    image: ${DOCKER_IMAGE:-app:latest}
    container_name: ${APP_NAME:-app}
    ports:
      - "8080:8080"
    volumes:
      - ${LOG_PATH:-./log}:/log # host path : container path
      - ${DEST_DIR:-.}/config:/app/config
    environment:
      - TZ=Asia/Seoul
      - APP_UID=${APP_UID:-1000}
      - APP_GID=${APP_GID:-1000}
    restart: unless-stopped

plugins {
    id 'java-gradle-plugin'
    id 'com.gradle.plugin-publish' version '1.3.1'
}

group = 'io.github.mj-youn'
version = '1.1.4'
description = 'Gradle distribution packaging plugin with embedded scripts and file-level override'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    // ReplaceTokens 등 Ant 필터 사용을 위한 의존성
    implementation 'org.apache.ant:ant:1.10.15'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

gradlePlugin {
    website = 'https://github.com/MJ-Youn/build-template/tree/gradle'
    vcsUrl = 'https://github.com/MJ-Youn/build-template/tree/gradle'
    plugins {
        distributionPlugin {
            id = 'io.github.mj-youn.distribution'
            displayName = 'Gradle 빌드/배포 쉘'
            description = 'Gradle distribution and packaging plugin with embedded scripts and @Override support'
            tags.set(['distribution', 'deployment', 'packaging', 'spring-boot'])
            implementationClass = 'io.github.mj_youn.plugin.DistributionPlugin'
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// 루트 프로젝트의 scripts/, docker/, build_deploy.sh를 유일한 단일 원본(SSOT)으로 삼아 플러그인 리소스에 포함
tasks.named('processResources') {
    from("${rootProject.projectDir}/scripts") {
        into 'template/scripts'
    }
    from("${rootProject.projectDir}/docker") {
        into 'template/docker'
    }
    from("${rootProject.projectDir}/build_deploy.sh") {
        into 'template'
    }

    // template 리소스 내부 파일 목록(manifest)을 자동 생성하여 JAR 내장 시 리소스 추출을 완벽하게 보장
    doLast {
        def templateDir = file("${destinationDir}/template")
        if (templateDir.exists()) {
            def manifestFile = file("${destinationDir}/template-manifest.txt")
            def filesList = []
            templateDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                def relative = templateDir.toPath().relativize(f.toPath()).toString()
                filesList << relative
            }
            manifestFile.text = filesList.join('\n')
            println "📋 템플릿 매니페스트 생성 완료 (${filesList.size()}개 파일)"
        }
    }
}

// Gradle Plugin Portal 배포 태스크 단축 별칭
tasks.register('publishGradlePlugins') {
    group = 'publishing'
    description = 'Publishes Gradle plugin to Gradle Plugin Portal'
    dependsOn 'publishPlugins'
}

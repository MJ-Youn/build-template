import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.github.mjyoun'
version = '0.1.0'
description = 'Demo project for Spring Boot'

def environments = ['dev', 'prod', 'local', 'test', 'stage']

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations {
    all {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

bootJar {
    // 실행 가능한 JAR 생성 시 설정 파일 제외 (외부 config 사용 위함)
    // src/main/resources에 있는 application.yml 등을 제외하여 빌드 결과물을 환경 독립적으로 만듦
    exclude 'application*.yml', 'application*.properties', 'log4j2*'
}

// 배포용 패키지 생성 태스크
// 실행 가능한 JAR, 설정 파일(config), 시작/종료 스크립트(bin)를 묶어 zip 파일로 생성
// 'package'는 예약어일 수 있으므로 따옴표로 감싸서 Task 이름으로 정의
task 'package'(type: Zip) {
    dependsOn bootJar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    def distName = "${project.name}-${project.version}"
    def envSuffix = ""
    def resolvedHttpPort = project.hasProperty('port') ? project.property('port') : (project.hasProperty('httpPort') ? project.property('httpPort') : '8443')
    def commonTokens = [
        appName: project.name,
        deployMode: '',
        dockerImage: "${project.name}:${project.version}".toString(),
        httpPort: resolvedHttpPort.toString()
    ]

    def targetOs = project.hasProperty('os') ? project.property('os').toString().toLowerCase() : 'linux'

    // 1. 환경별 파일 (Environment Specific Files)
    // 먼저 추가된 파일이 우선순위를 가짐 (EXCLUDE 전략)
    if (project.hasProperty('env')) {
        def env = project.property('env')
        envSuffix = "-${env}"
        
        // 환경별 설정 파일 오버레이 (config.profiles/$env 우선, config/$env 호환 지원)
        def profileDir = file("config.profiles/$env")
        if (profileDir.exists()) {
            from(profileDir) {
                into 'config'
                rename { String filename ->
                    filename.replace("-${env}", "")
                }
            }
        } else {
            from("config/$env") {
                into 'config'
                rename { String filename ->
                    filename.replace("-${env}", "")
                }
            }
        }
        
        // 환경별 스크립트 오버레이 (scripts/$env)
        from("scripts/$env/service") {
            into 'bin'
            filter(ReplaceTokens, tokens: commonTokens)
            rename { String filename -> filename.replace("-${env}", "") }
            if (targetOs == 'linux') {
                exclude '**/*.bat'
            } else if (targetOs == 'windows' || targetOs == 'win') {
                exclude '**/*.sh'
            }
            exclude '**/*test*'
        }
        from("scripts/$env/deploy") {
            into 'deploy'
            filter(ReplaceTokens, tokens: commonTokens)
            rename { String filename -> filename.replace("-${env}", "") }
            if (targetOs == 'linux') {
                exclude '**/*.bat'
            } else if (targetOs == 'windows' || targetOs == 'win') {
                exclude '**/*.sh'
            }
            exclude '**/*test*'
        }
        // 기존 scripts/$env 루트에 위치한 파일도 하위 호환을 위해 bin으로 지원
        from("scripts/$env") {
            into 'bin'
            filter(ReplaceTokens, tokens: commonTokens)
            rename { String filename -> filename.replace("-${env}", "") }
            if (targetOs == 'linux') {
                exclude '**/*.bat'
            } else if (targetOs == 'windows' || targetOs == 'win') {
                exclude '**/*.sh'
            }
            exclude 'deploy/**', 'service/**', 'common/**', '**/*test*'
        }
    }
    
    doFirst {
        println "📦 타겟 OS: ${targetOs.toUpperCase()} (옵션: -Pos=linux|windows|all, 기본값: linux)"
        if (project.hasProperty('env')) {
            println "📦 배포 패키지 생성 중 (환경: ${project.property('env')})"
        } else {
            println "📦 기본 환경(dev) 또는 지정되지 않은 환경으로 배포 패키지를 생성합니다."
        }
    }

    // 2. 기본 파일 (Base Files)
    // 이미 추가된 파일(환경별 파일)이 있다면 이 파일들은 무시됨 (명시적으로 중복 파일 제외)
    from('config') {
        into 'config'
        // 환경별 폴더가 Zip 루트에 그대로 들어가는 것을 방지 (깔끔한 패키징)
        exclude environments
        if (project.hasProperty('env')) {
            def env = project.property('env')
            exclude env
            
            // 환경별 파일로 덮어쓰기 위해, 이름이 동일해질 기본 파일들을 명시적으로 제외
            def envDir = file("config.profiles/${env}").exists() ? file("config.profiles/${env}") : file("config/${env}")
            if (envDir.exists()) {
                envDir.listFiles().each { File envFile ->
                    if (envFile.isFile()) {
                        def baseName = envFile.name.replace("-${env}", "")
                        exclude baseName
                    }
                }
            }
        }
    }

    // 2-1. 서비스 구동용 스크립트 (service) -> bin
    from('scripts/service') {
        into 'bin'
        filter(ReplaceTokens, tokens: commonTokens)
        exclude environments
        if (project.hasProperty('env')) {
            exclude project.property('env')
        }
        if (targetOs == 'linux') {
            exclude '**/*.bat'
        } else if (targetOs == 'windows' || targetOs == 'win') {
            exclude '**/*.sh'
        }
        exclude '**/*test*'
    }

    // 2-2. 배포/설치용 스크립트 (deploy) -> deploy
    from('scripts/deploy') {
        into 'deploy'
        filter(ReplaceTokens, tokens: commonTokens)
        exclude environments
        if (project.hasProperty('env')) {
            exclude project.property('env')
        }
        if (targetOs == 'linux') {
            exclude '**/*.bat'
        } else if (targetOs == 'windows' || targetOs == 'win') {
            exclude '**/*.sh'
        }
        exclude '**/*test*'
    }

    // 2-3. 공통 유틸리티 스크립트 (common) -> bin 및 deploy 모두에 배치
    from('scripts/common') {
        into 'bin'
        filter(ReplaceTokens, tokens: commonTokens)
        if (targetOs == 'linux') {
            exclude '**/*.bat'
        } else if (targetOs == 'windows' || targetOs == 'win') {
            exclude '**/*.sh'
        }
        exclude '**/*test*'
    }
    from('scripts/common') {
        into 'deploy'
        filter(ReplaceTokens, tokens: commonTokens)
        if (targetOs == 'linux') {
            exclude '**/*.bat'
        } else if (targetOs == 'windows' || targetOs == 'win') {
            exclude '**/*.sh'
        }
        exclude '**/*test*'
    }

    // 4. Docker 관련 파일 (서버에서 Docker 배포 시 사용)
    // Dockerfile: dist 패키지 기반 Docker 이미지 빌드용 (initDocker에 의해 생성된 docker/Dockerfile 사용)
    def dockerfileForDist = file('docker/Dockerfile')
    if (dockerfileForDist.exists()) {
        from(dockerfileForDist) {
            into 'docker'
        }
    } else {
        def defaultDf = file('docker/Dockerfile-jar')
        if (defaultDf.exists()) {
            from(defaultDf) {
                into 'docker'
                rename { 'Dockerfile' }
            }
        }
    }

    // 환경별 docker-compose.yml 선택
    def packageEnv = project.hasProperty('env') ? project.property('env') : 'dev'
    def pkgEnvComposeFile = file("docker/${packageEnv}/docker-compose-${packageEnv}.yml")
    def pkgBaseComposeFile = file('docker/docker-compose.yml')
    def pkgComposeFile = pkgEnvComposeFile.exists() ? pkgEnvComposeFile : pkgBaseComposeFile
    if (pkgComposeFile.exists()) {
        from(pkgComposeFile) {
            into 'docker'
            rename { 'docker-compose.yml' }
        }
    } else {
        def defaultCompose = file('docker/docker-compose-jar.yml')
        if (defaultCompose.exists()) {
            from(defaultCompose) {
                into 'docker'
                rename { 'docker-compose.yml' }
            }
        }
    }

    archiveFileName = "${distName}${envSuffix}.dist.zip"
    destinationDirectory = file("${buildDir}/dist")

    // 3. Libs
    from(bootJar.outputs.files) {
        into 'libs'
    }
}

// 표준 'build' 태스크 실행 시 'package' 태스크도 함께 실행되도록 설정
tasks.named('build') {
    dependsOn 'package'
}

// Docker 빌드를 위한 컨텍스트와 배포 스크립트를 준비합니다.
task prepareDockerContext {
    dependsOn 'package'
    group = 'build'
    description = 'Docker 빌드를 위한 컨텍스트를 준비합니다.'

    doLast {
        def distName = "${project.name}-${project.version}"
        def envSuffix = project.hasProperty('env') ? "-${project.property('env')}" : ""
        def distZipName = "${distName}${envSuffix}.dist.zip"
        def dockerContext = file("${buildDir}/docker-build")
        
        println "🐳 === Docker 빌드 컨텍스트 준비 시작 ==="
        delete dockerContext
        mkdir dockerContext
        
        def distZipFile = file("${buildDir}/dist/${distZipName}")
        if (!distZipFile.exists()) { throw new GradleException("배포 파일을 찾을 수 없습니다: $distZipFile") }

        copy { from zipTree(distZipFile); into dockerContext }

        def dockerfilePath = file('docker/Dockerfile')
        if (dockerfilePath.exists()) {
            copy { from dockerfilePath; into dockerContext }
        } else if (file('docker/Dockerfile-jar').exists()) {
            copy { from file('docker/Dockerfile-jar'); into dockerContext; rename { 'Dockerfile' } }
        }
        
        println "✅ Docker 컨텍스트 준비 완료: ${dockerContext.absolutePath}"
    }
}

task dockerBuild {
    dependsOn 'prepareDockerContext'
    group = 'build'
    description = 'Docker 이미지를 로컬 데몬에 빌드합니다.'

    doLast {
        def dockerContext = file("${buildDir}/docker-build")
        println "🔨 === Docker 이미지 빌드 시작 ==="
        def registry = project.hasProperty('dockerRegistry') ? project.property('dockerRegistry') : ""
        def tag = project.hasProperty('dockerImageTag') ? project.property('dockerImageTag') : "${project.version}"
        def imageName = "${project.name}:${tag}"
        if (registry) {
            imageName = "${registry}/${project.name}:${tag}"
            if (!registry.endsWith('/')) { imageName = "${registry}/${project.name}:${tag}" }
        }
        println "🔖 대상 이미지 태그: ${imageName}"
        def buildProc = ['docker', 'build', '--build-arg', "APP_NAME=${project.name}", '-t', imageName, '-f', "${dockerContext}/Dockerfile", dockerContext.absolutePath].execute()
        buildProc.waitForProcessOutput(System.out, System.err)
        if (buildProc.exitValue() != 0) { throw new GradleException("Docker 빌드 실패") }
        println "✨ === Docker 이미지 빌드 성공: ${imageName} ==="
    }
}

task dockerBuildRemote {
    dependsOn dockerBuild
    group = 'build'
    description = 'Docker 이미지를 빌드하고 레지스트리에 Push합니다. (Strategy 3)'

    doLast {
        def registry = project.hasProperty('dockerRegistry') ? project.property('dockerRegistry') : ""
        if (!registry) {
            throw new GradleException("Push를 하려면 dockerRegistry 속성이 필요합니다. 예: -PdockerRegistry=my.reg.com")
        }
        
        def tag = project.hasProperty('dockerImageTag') ? project.property('dockerImageTag') : "${project.version}"
        if (!registry.endsWith('/')) registry += '/'
        
        def fullImageName = "${registry}${project.name}:${tag}"
        
        println "☁️ === Docker 이미지 Push 시작 ==="
        println "📤 이미지 Push 중: $fullImageName"
        
        def pushProc = ['docker', 'push', fullImageName].execute()
        pushProc.waitForProcessOutput(System.out, System.err)
        
        if (pushProc.exitValue() != 0) {
            throw new GradleException("Docker Push 실패. 레지스트리 로그인 상태를 확인해주세요.")
        }

        // -----------------------------------------------------------------------
        // Push 완료 후 서버 배포 방법을 콘솔에 단계별로 안내
        // 실제 이미지명/경로를 채워서 출력하므로 그대로 복사·붙여넣기 가능
        // -----------------------------------------------------------------------
        def distDirPath = "${buildDir}/docker-dist"
        println ""
        println "╔══════════════════════════════════════════════════════════════════╗"
        println "║  ✅  Docker 이미지 Push 완료                                     ║"
        println "╠══════════════════════════════════════════════════════════════════╣"
        println "║  🖼️   이미지  : ${fullImageName}"
        println "║  📂  배포파일  : ${distDirPath}"
        println "║  📄  가이드   : ${distDirPath}/DEPLOY-GUIDE.md"
        println "╠══════════════════════════════════════════════════════════════════╣"
        println "║  🚀 서버 배포 순서 (아래 명령어를 순서대로 실행하세요)             ║"
        println "╠══════════════════════════════════════════════════════════════════╣"
        println "║"
        println "║  [1] 배포 파일 서버 전송"
        println "║      scp -r ${distDirPath}/ user@your-server:/home/user/"
        println "║"
        println "║  [2] Registry 로그인 (Private Registry인 경우)"
        println "║      docker login ${registry}"
        println "║"
        println "║  [3] 이미지 Pull"
        println "║      docker pull ${fullImageName}"
        println "║"
        println "║  [4-a] 자동 설치 (Systemd 서비스 등록 포함 — 권장)"
        println "║      cd /home/user/docker-dist"
        println "║      sudo ./deploy/install_service.sh"
        println "║"
        println "║  [4-b] 수동 실행 (docker compose 직접)"
        println "║      cd /home/user/docker-dist"
        println "║      echo 'DOCKER_IMAGE=${fullImageName}' >> .env"
        println "║      docker compose up -d"
        println "║"
        println "║  💡 상세 가이드: ${distDirPath}/DEPLOY-GUIDE.md"
        println "║"
        println "╚══════════════════════════════════════════════════════════════════╝"
    }
}

// Docker 이미지를 빌드하고 배포용 스크립트와 함께 Zip으로 패키징합니다. (Strategy 1)
task packageDocker {
    dependsOn dockerBuild
    group = 'build'
    description = 'Docker 이미지를 빌드하고 배포용 스크립트와 함께 Zip으로 패키징합니다. (Strategy 1)'

    doLast {
        def envSuffix = project.hasProperty('env') ? "-${project.property('env')}" : ""
        def dockerDistZipName = "${project.name}-docker${envSuffix}.zip" 
        def dockerDistDir = file("${buildDir}/docker-dist")
        def dockerContext = file("${buildDir}/docker-build")
        def registry = project.hasProperty('dockerRegistry') ? project.property('dockerRegistry') : ""
        def tag = project.hasProperty('dockerImageTag') ? project.property('dockerImageTag') : "${project.version}"
        def tagName = "${project.name}:${tag}"
        if (registry) {
            if (!registry.endsWith('/')) registry += '/'
            tagName = "${registry}${project.name}:${tag}"
        }
        def tarName = "${project.name}.tar"

        println "📦 === Docker 배포 패키지 생성 시작 (Strategy 1) ==="
        delete dockerDistDir; mkdir dockerDistDir
        println "💾 Docker 이미지 추출 중 (docker save) -> ${dockerDistDir}/${tarName}..."
        def saveProc = ['docker', 'save', '-o', "${dockerDistDir}/${tarName}", tagName].execute()
        saveProc.waitForProcessOutput(System.out, System.err)
        if (saveProc.exitValue() != 0) { throw new GradleException("Docker Save 실패") }
        
        println "📂 설정 및 스크립트 파일 복사 중..."
        def composeSrc = file("${dockerContext}/docker/docker-compose.yml")
        if (composeSrc.exists()) { 
            copy { from composeSrc; into "${dockerDistDir}/docker" } 
        }
        def configDir = file("${dockerContext}/config")
        if (configDir.exists()) { 
            copy { from configDir; into "${dockerDistDir}/config" } 
        }
        def binDir = file("${dockerContext}/bin")
        if (binDir.exists()) { 
            copy { from binDir; into "${dockerDistDir}/bin" } 
        }
        def deployDir = file("${dockerContext}/deploy")
        if (deployDir.exists()) { 
            copy { from deployDir; into "${dockerDistDir}/deploy" } 
        }
        def cronDir = file("${dockerContext}/bin/cron")
        if (cronDir.exists()) { 
            copy { from cronDir; into "${dockerDistDir}/cron" } 
        }
        
        println "🗜️ 최종 배포용 Zip 생성 중: ${buildDir}/dist/${dockerDistZipName}"
        ant.zip(destfile: "${buildDir}/dist/${dockerDistZipName}") {
            zipfileset(dir: dockerDistDir, excludes: "**/*.sh")
            zipfileset(dir: dockerDistDir, includes: "**/*.sh", filemode: "755")
        }
        delete dockerDistDir
        println "✅ === Docker 배포 패키지 생성 완료: ${buildDir}/dist/${dockerDistZipName} ==="
    }
}

// 기존 help 태스크 확장 (프로젝트 전용 가이드 추가)
tasks.named('help') {
    doLast {
        println """
================================================================================
🚀 [Build Template] 빌드 및 배포 가이드 (Spring Boot Boilerplate)
================================================================================
💡 초기화 스크립트 (init.sh): 
   명령어 `./init.sh` 를 통해 패키지명, 포트포워딩 등을 입력하여 자동 설정할 수 있습니다!

이 프로젝트는 여러 빌드/배포 환경(Legacy, Docker)을 지원합니다.

[기본 빌드 명령어]
  ./gradlew build           : 표준 빌드 수행 (기본 패키징 포함)
  ./gradlew clean           : 빌드 결과물 정리

[환경 지정 옵션 (-Penv=...)]
  모든 배포 태스크에 환경(`dev`, `prod`, `local` 등)을 지정할 수 있습니다.
  지정 시 `config.profiles/{env}/` 및 `scripts/{env}/` 내의 파일들이 오버레이(덮어쓰기) 됩니다.
  예시: ./gradlew package -Penv=prod

[배포 태스크 (Distribution Tasks)]
  📦 1. package
     - 일반 서버(Legacy / Docker 선택 가능) 배포용 Zip 생성
     - 산출물: build/dist/{APP_NAME}-{version}-{env}.dist.zip
     - 포함 내용: JAR + Scripts (deploy/, bin/) + Config + docker/ (Dockerfile, docker-compose.yml)
     - 서버 배포 시 deploy/install_service.sh를 실행하면 Legacy 또는 Docker 방식을 선택할 수 있습니다.
     - 예시: ./gradlew package -Penv=prod

  🐳 2. packageDocker (Strategy 1 - 오프라인/폐쇄망 환경용)
     - [타겟 환경] 외부 인터넷이나 레지스트리 접근이 불가한 폐쇄망 서버
     - [작업 내용] 이미지를 빌드하고 .tar로 추출하여 스크립트와 함께 Zip 압축
     - [전송 방식] 완성된 Zip 파일을 운영 서버로 직접 복사(전송)해야 함
     - [주요 산출물] build/dist/{APP_NAME}-docker-{env}.zip
     - [실행 예시] ./gradlew packageDocker -Penv=prod

  ☁️ 3. dockerBuildRemote (Strategy 2 - 표준 CI/CD 파이프라인용)
     - [타겟 환경] AWS ECR, Docker Hub 등의 원격 저장소를 활용하는 환경
     - [작업 내용] Docker 이미지를 빌드하고 지정된 원격 레지스트리로 push
     - [전송 방식] 파일 전송 불필요 (운영 서버에서 docker pull로 수신)
     - [주요 산출물] 원격 레지스트리에 업로드된 Docker Image
     - [옵션 필수] -PdockerRegistry={REGISTRY_URL} (선택: -PdockerImageTag={TAG_NAME})
     - [실행 예시] ./gradlew dockerBuildRemote -Penv=prod -PdockerRegistry=my.reg.com/repo

[🐳 Docker 유틸리티]
  ./gradlew initDocker               : 배포 유형에 맞는 Dockerfile & docker-compose 생성
  ./gradlew initDocker -Ptype=jar    : JAR 배포용 Dockerfile 생성 (libs/ + bin/start.sh)
  ./gradlew initDocker -Ptype=tomcat : Tomcat 배포용 Dockerfile 생성 (Apache Tomcat + webapps/ROOT)
  ./gradlew showDocker               : JAR vs Tomcat Dockerfile 구조 및 차이점 콘솔 출력

[🚀 플러그인 모듈 개발 및 배포 (루트 저장소 관리자 전용)]
  1. 플러그인 로컬 빌드 및 로컬 Maven 캐시(~/.m2/repository)에 설치 (로컬 테스트 전 필수):
     ./gradlew :distribution-gradle-plugin:publishToMavenLocal
     ./gradlew :distribution-maven-plugin:publishToMavenLocal

  2. 공식 퍼블릭 저장소 원클릭 동시 배포 (Gradle Plugin Portal + Sonatype Central Portal):
     ./gradlew publishAllPlugins
================================================================================
"""
    }
}


// 🐳 JAR vs Tomcat Dockerfile 비교 가이드 출력 태스크
task showDocker {
    group = 'distribution'
    description = 'JAR 배포와 Tomcat 배포의 Docker 컨테이너 구조 및 Dockerfile 차이점을 콘솔에서 확인합니다.'
    doLast {
        println """
================================================================================
================================================================================

┌─────────────────┬──────────────────────────────────┬──────────────────────────────────┐
│ 비교 항목       │ 📦 JAR 모드 (Executable JAR)     │ 🐱 Tomcat 모드 (Standalone Tomcat)│
├─────────────────┼──────────────────────────────────┼──────────────────────────────────┤
│ 베이스 이미지   │ eclipse-temurin:25-jdk-alpine    │ eclipse-temurin:25-jdk-alpine +  │
│                 │                                  │ Apache Tomcat 바이너리 자동 설치 │
├─────────────────┼──────────────────────────────────┼──────────────────────────────────┤
│ 빌드 산출물     │ build/libs/*.jar                 │ build/exploded-webapps/ROOT/     │
│                 │ (Spring Boot 실행 가능 단일 JAR) │ (또는 ROOT.war)                  │
├─────────────────┼──────────────────────────────────┼──────────────────────────────────┤
│ 컨테이너 복사   │ COPY libs/ /app/libs/            │ COPY webapps/ROOT/ .../webapps/ROOT/
│                 │ COPY config/ /app/config/        │ COPY tomcat/conf/ .../conf/      │
│                 │ COPY bin/ /app/bin/              │ COPY tomcat/bin/setenv.sh .../   │
│                 │                                  │ COPY config/ .../config/         │
├─────────────────┼──────────────────────────────────┼──────────────────────────────────┤
│ 실행 엔트리포인트│ ENTRYPOINT ["/app/bin/start.sh"] │ ENTRYPOINT ["catalina.sh", "run"]│
├─────────────────┼──────────────────────────────────┼──────────────────────────────────┤
│ 주요 볼륨 마운트│ -v ./config:/app/config          │ -v ./webapps/ROOT:.../ROOT       │
│                 │ -v ./log:/log                    │ -v ./tomcat/conf:.../conf        │
│                 │                                  │ -v ./config:.../config           │
│                 │                                  │ -v ./log/tomcat:.../logs         │
├─────────────────┼──────────────────────────────────┼──────────────────────────────────┤
│ 주요 용도 및 장점│ 경량 마이크로서비스, 빠른 기동,   │ 엔터프라이즈 레거시 호환, JNDI/Datasource,
│                 │ 단일 패키지 배포 표준            │ 외부 설정 동적 튜닝, Exploded 무중단 갱신
└─────────────────┴──────────────────────────────────┴──────────────────────────────────┘

[💡 사용 명령어]
  1. 현재 설정 기반 생성 : ./gradlew initDocker
  2. JAR 배포용 강제 생성 : ./gradlew initDocker -Ptype=jar
  3. Tomcat용 강제 생성  : ./gradlew initDocker -Ptype=tomcat
  4. 본 비교 가이드 재출력: ./gradlew showDocker
================================================================================
"""
    }
}

// 🐳 배포 유형에 맞는 Dockerfile 및 docker-compose.yml 생성 태스크
task initDocker {
    group = 'distribution'
    description = '프로젝트에 배포 유형(JAR 또는 Tomcat)에 맞는 Dockerfile 및 docker-compose.yml을 생성합니다.'
    dependsOn 'showDocker'

    doLast {
        def targetType = project.hasProperty('type') ? project.property('type').toString().toLowerCase() :
                         (project.hasProperty('packageType') ? project.property('packageType').toString().toLowerCase() : 'jar')
        def isTomcat = targetType == 'tomcat' || targetType == 'war'
        def dockerDir = file('docker')
        if (!dockerDir.exists()) {
            dockerDir.mkdirs()
        }

        def tokens = [
            appName: project.name,
            version: project.version.toString(),
            deployMode: '',
            dockerImage: "${project.name}:${project.version}".toString(),
            appType: targetType,
            tomcatVersion: project.hasProperty('tomcatVersion') ? project.property('tomcatVersion').toString() : '11.0.15',
            httpPort: project.hasProperty('httpPort') ? project.property('httpPort').toString() : (project.hasProperty('port') ? project.property('port').toString() : '8443')
        ]

        def activeDockerTemplate = file(isTomcat ? 'docker/Dockerfile-tomcat' : 'docker/Dockerfile-jar')
        def activeComposeTemplate = file(isTomcat ? 'docker/docker-compose-tomcat.yml' : 'docker/docker-compose-jar.yml')

        def targetDockerFile = file('docker/Dockerfile')
        def targetComposeFile = file('docker/docker-compose.yml')

        if (activeDockerTemplate.exists()) {
            def content = activeDockerTemplate.getText('UTF-8')
            tokens.each { k, v -> content = content.replace("@${k}@", v.toString()) }
            targetDockerFile.setText(content, 'UTF-8')
        }

        if (activeComposeTemplate.exists()) {
            def content = activeComposeTemplate.getText('UTF-8')
            tokens.each { k, v -> content = content.replace("@${k}@", v.toString()) }
            targetComposeFile.setText(content, 'UTF-8')
        }

        println "================================================================"
        println "🐳 [Distribution] Docker 설정 생성 완료 (배포 유형: ${targetType.toUpperCase()})"
        println "   - 생성된 Dockerfile     : ${targetDockerFile.absolutePath}"
        println "   - 생성된 docker-compose : ${targetComposeFile.absolutePath}"
        println "================================================================"
    }
}

